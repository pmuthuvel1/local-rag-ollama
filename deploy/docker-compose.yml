version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loomin-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:8000/api
    networks:
      - loomin-network
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loomin-backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama2
      - DATABASE_URL=sqlite:////app/data/loomin-docs.db
      - FAISS_INDEX_PATH=/app/data/rag_index
      - UPLOAD_DIR=/mnt/uploads
      - DEBUG=False
      - LOG_LEVEL=INFO
    networks:
      - loomin-network
    volumes:
      - ./backend/app:/app/app
      - loomin-data:/app/data
      - uploads:/mnt/uploads
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: loomin-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - loomin-network
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

networks:
  loomin-network:
    driver: bridge

volumes:
  loomin-data:
  ollama-data:
  uploads:
